<!DOCTYPE html>

<style>

.slider:before {

<script>

/* =====================================================
   默认设置
===================================================== */

const defaultSettings = {

    monthlyPay: 8000,

    startTime: "09:00",

    endTime: "18:00",

    lunchStart: "12:00",

    lunchEnd: "13:00",

    workSystem: 5,

    overtimeEnd: "21:00",

    overtimeRate: 1.5,

    /*
        新增：
        rate = 倍率
        fixed = 固定时薪
    */

    overtimeMode: "rate",

    fixedOvertimePay: 50

};


/* =====================================================
   读取本地设置
===================================================== */

let settings =
    JSON.parse(
        localStorage.getItem(
            "workTimerSettings"
        )
    ) || defaultSettings;


/*
    兼容旧版本设置
*/

settings.overtimeMode =
    settings.overtimeMode || "rate";

settings.fixedOvertimePay =
    Number(
        settings.fixedOvertimePay
    ) || 50;


/* =====================================================
   2026 中国法定节假日
===================================================== */

const holidays2026 = [

    {
        name: "元旦",
        start: "2026-01-01",
        end: "2026-01-03"
    },

    {
        name: "春节",
        start: "2026-02-15",
        end: "2026-02-23"
    },

    {
        name: "清明节",
        start: "2026-04-04",
        end: "2026-04-06"
    },

    {
        name: "劳动节",
        start: "2026-05-01",
        end: "2026-05-05"
    },

    {
        name: "端午节",
        start: "2026-06-19",
        end: "2026-06-21"
    },

    {
        name: "中秋节",
        start: "2026-09-25",
        end: "2026-09-27"
    },

    {
        name: "国庆节",
        start: "2026-10-01",
        end: "2026-10-07"
    }

];


/* =====================================================
   2026 调休上班日
===================================================== */

const workMakeupDays2026 = [

    "2026-01-04",

    "2026-02-14",
    "2026-02-28",

    "2026-05-09",

    "2026-09-20",

    "2026-10-10"

];


/* =====================================================
   日期工具
===================================================== */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function timeToDate(time) {

    const [hour, minute] =
        time.split(":").map(Number);

    const d =
        new Date();

    d.setHours(
        hour,
        minute,
        0,
        0
    );

    return d;
}


function secondsToTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const h =
        Math.floor(
            seconds / 3600
        );

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;

    return (
        String(h).padStart(2, "0")
        + ":"
        + String(m).padStart(2, "0")
        + ":"
        + String(s).padStart(2, "0")
    );
}


function money(number) {

    return "¥" +
        Number(number).toFixed(2);
}


/* =====================================================
   是否法定放假
===================================================== */

function getHoliday(date) {

    const key =
        dateKey(date);

    return holidays2026.find(
        holiday =>
            key >= holiday.start &&
            key <= holiday.end
    );
}


/* =====================================================
   是否调休上班
===================================================== */

function isMakeupWorkday(date) {

    const key =
        dateKey(date);

    return workMakeupDays2026.includes(
        key
    );
}


/* =====================================================
   判断是否为正常周工作日
===================================================== */

function isNormalWorkday(date) {

    const week =
        date.getDay();

    if(settings.workSystem == 5) {

        return (
            week >= 1 &&
            week <= 5
        );

    }

    return (
        week >= 1 &&
        week <= 6
    );
}


/* =====================================================
   最终判断今天是否工作
===================================================== */

function isWorkday(date) {

    const key =
        dateKey(date);

    if(isMakeupWorkday(date)) {

        return true;
    }

    if(getHoliday(date)) {

        return false;
    }

    return isNormalWorkday(date);
}


/* =====================================================
   获取当前月份应工作日
===================================================== */

function getMonthWorkdays(
    year,
    month
) {

    let count = 0;

    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    for(
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );

        if(isWorkday(date)) {

            count++;
        }

    }

    return count;
}


/* =====================================================
   获取本月已经过去的工作日
===================================================== */

function getWorkedDays() {

    const now =
        new Date();

    let count = 0;

    for(
        let day = 1;
        day <= now.getDate();
        day++
    ) {

        const date =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                day
            );

        if(isWorkday(date)) {

            count++;
        }

    }

    return count;
}


/* =====================================================
   工资计算
===================================================== */

function calculateSalary() {

    const now =
        new Date();

    const workDays =
        getMonthWorkdays(
            now.getFullYear(),
            now.getMonth()
        );

    const dailySalary =
        settings.monthlyPay /
        workDays;


    const start =
        timeToDate(
            settings.startTime
        );

    const end =
        timeToDate(
            settings.endTime
        );

    const lunchStart =
        timeToDate(
            settings.lunchStart
        );

    const lunchEnd =
        timeToDate(
            settings.lunchEnd
        );


    let normalSeconds =
        (end - start) / 1000;


    normalSeconds -=
        (lunchEnd - lunchStart) / 1000;


    const hourlySalary =
        dailySalary /
        (normalSeconds / 3600);


    return {

        workDays,

        dailySalary,

        hourlySalary,

        normalSeconds

    };
}


/* =====================================================
   今日状态
===================================================== */

function updateTodayStatus() {

    const now =
        new Date();

    const holiday =
        getHoliday(now);

    const makeup =
        isMakeupWorkday(now);

    const work =
        isWorkday(now);


    const title =
        document.getElementById(
            "todayStatus"
        );

    const info =
        document.getElementById(
            "todayStatusInfo"
        );


    if(makeup) {

        title.innerText =
            "📌 今天调休上班";

        info.innerText =
            "虽然是周末，但今天属于官方调休工作日。";

        return;
    }


    if(holiday) {

        title.innerText =
            "🎉 今天是" +
            holiday.name +
            "假期";

        info.innerText =
            holiday.start +
            " ～ " +
            holiday.end;

        return;
    }


    if(work) {

        title.innerText =
            "💼 今天正常上班";

        info.innerText =
            settings.workSystem == 5
            ? "双休制度"
            : "单休制度";

        return;
    }


    title.innerText =
        "😌 今天休息";

    info.innerText =
        "好好休息一下吧。";
}


/* =====================================================
   下一个法定节假日
===================================================== */

function updateNextHoliday() {

    const now =
        new Date();

    const currentKey =
        dateKey(now);


    const next =
        holidays2026.find(
            holiday =>
                holiday.end >= currentKey
        );


    if(!next) {

        document.getElementById(
            "nextHoliday"
        ).innerText =
            "今年法定节假日已结束";

        document.getElementById(
            "nextHolidayInfo"
        ).innerText =
            "";

        return;
    }


    document.getElementById(
        "nextHoliday"
    ).innerText =
        "🎉 " +
        next.name;


    document.getElementById(
        "nextHolidayInfo"
    ).innerText =
        next.start +
        " ～ " +
        next.end;
}


/* =====================================================
   设置页面
===================================================== */

function loadSettings() {

    document.getElementById(
        "monthlyPayInput"
    ).value =
        settings.monthlyPay;


    document.getElementById(
        "startTimeInput"
    ).value =
        settings.startTime;


    document.getElementById(
        "endTimeInput"
    ).value =
        settings.endTime;


    document.getElementById(
        "lunchStartInput"
    ).value =
        settings.lunchStart;


    document.getElementById(
        "lunchEndInput"
    ).value =
        settings.lunchEnd;


    document.getElementById(
        "workSystemInput"
    ).value =
        settings.workSystem;


    document.getElementById(
        "overtimeEndInput"
    ).value =
        settings.overtimeEnd;


    document.getElementById(
        "overtimeRateInput"
    ).value =
        settings.overtimeRate;


    document.getElementById(
        "overtimeModeInput"

}

/* =====================================================
   每日工资记录
===================================================== */

let salaryRecords =
    JSON.parse(
        localStorage.getItem(
            "dailySalaryRecords"
        )
    ) || {};


/* =====================================================
   保存每日工资
===================================================== */

function saveDailySalaryRecord(
    normalSalary,
    overtimeSalary
) {

    const now =
        new Date();

    const key =
        dateKey(now);


    const normal =
        Number(
            normalSalary
        ) || 0;


    const overtime =
        Number(
            overtimeSalary
        ) || 0;


    const total =
        normal +
        overtime;


    salaryRecords[key] = {

        date: key,

        normalSalary: normal,

        overtimeSalary: overtime,

        totalSalary: total

    };


    localStorage.setItem(
        "dailySalaryRecords",
        JSON.stringify(
            salaryRecords
        )
    );


    updateSalaryRecords();
}


/* =====================================================
   本月累计工资
===================================================== */

function getMonthRecordedSalary() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    let total = 0;


    Object.keys(
        salaryRecords
    ).forEach(
        key => {

            if(
                key.startsWith(
                    `${year}-${month}`
                )
            ) {

                total +=
                    Number(
                        salaryRecords[key]
                            .totalSalary
                    ) || 0;

            }

        }
    );


    return total;
}


/* =====================================================
   显示工资记录
===================================================== */

function updateSalaryRecords() {

    const container =
        document.getElementById(
            "salaryRecords"
        );


    if(!container) return;


    const today =
        dateKey(
            new Date()
        );


    const todayRecord =
        salaryRecords[today];


    document.getElementById(
        "recordTodaySalary"
    ).innerText =
        money(
            todayRecord
            ? todayRecord.totalSalary
            : 0
        );


    document.getElementById(
        "recordMonthSalary"
    ).innerText =
        money(
            getMonthRecordedSalary()
        );


    const records =
        Object.values(
            salaryRecords
        ).sort(
            (a, b) =>
                b.date.localeCompare(
                    a.date
                )
        );


    if(records.length === 0) {

        container.innerHTML = `

            <div style="
                text-align:center;
                color:#999;
                font-size:13px;
                padding:15px 0;
            ">
                还没有工资记录
            </div>

        `;

        return;
    }


    const recentRecords =
        records.slice(
            0,
            31
        );


    container.innerHTML =
        recentRecords.map(
            record => `

            <div class="salary-record">

                <div>

                    <div class="salary-record-date">
                        ${record.date}
                    </div>

                    <div class="salary-record-detail">

                        正常
                        ${money(
                            record.normalSalary
                        )}

                        ·

                        加班
                        ${money(
                            record.overtimeSalary
                        )}

                    </div>

                </div>


                <div style="
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">

                    <div class="salary-record-total">
                        ${money(
                            record.totalSalary
                        )}
                    </div>

                    <button
                        class="delete-record"
                        onclick="
                            deleteSalaryRecord(
                                '${record.date}'
                            )
                        "
                    >
                        删除
                    </button>

                </div>

            </div>

        `
        ).join("");
}


/* =====================================================
   删除工资记录
===================================================== */

function deleteSalaryRecord(date) {

    if(
        !confirm(
            "确定删除 " +
            date +
            " 的工资记录吗？"
        )
    ) {

        return;
    }


    delete salaryRecords[date];


    localStorage.setItem(
        "dailySalaryRecords",
        JSON.stringify(
            salaryRecords
        )
    );


    updateSalaryRecords();
}


/* =====================================================
   主更新
===================================================== */

function update() {

    const now =
        new Date();


    document.getElementById(
        "currentDate"
    ).innerText =
        now.toLocaleDateString(
            "zh-CN",
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                weekday: "long"
            }
        );


    updateTodayStatus();

    updateNextHoliday();


    const salary =
        calculateSalary();


    document.getElementById(
        "workDays"
    ).innerText =
        salary.workDays +
        " 天";


    document.getElementById(
        "workedDays"
    ).innerText =
        getWorkedDays() +
        " 天";


    document.getElementById(
        "dailySalary"
    ).innerText =
        money(
            salary.dailySalary
        );


    document.getElementById(
        "dailySalary2"
    ).innerText =
        money(
            salary.dailySalary
        );


    document.getElementById(
        "monthlySalary"
    ).innerText =
        money(
            settings.monthlyPay
        );


    /*
        休息日
    */

    if(!isWorkday(now)) {

        document.getElementById(
            "countdown"
        ).innerText =
            "今天休息 🎉";


        document.getElementById(
            "progressBar"
        ).style.width =
            "0%";


        document.getElementById(
            "progressText"
        ).innerText =
            "今天不是工作日";


        document.getElementById(
            "normalSalary"
        ).innerText =
            "¥0.00";


        document.getElementById(
            "earnedToday"
        ).innerText =
            "¥0.00";


        /*
            休息日记录
        */

        saveDailySalaryRecord(
            0,
            0
        );


        return;
    }


    /*
        正常上下班
    */

    const start =
        timeToDate(
            settings.startTime
        );


    const end =
        timeToDate(
            settings.endTime
        );


    const lunchStart =
        timeToDate(
            settings.lunchStart
        );


    const lunchEnd =
        timeToDate(
            settings.lunchEnd
        );


    /*
        下班倒计时
    */

    const remaining =
        (end - now) /
        1000;


    if(remaining > 0) {

        document.getElementById(
            "countdown"
        ).innerText =
            secondsToTime(
                remaining
            );

    } else {

        document.getElementById(
            "countdown"
        ).innerText =
            "下班啦 🎉";
    }


    /*
        正常工作总秒数
    */

    const totalWorkSeconds =
        (end - start) /
        1000
        -
        (lunchEnd - lunchStart) /
        1000;


    let workedSeconds = 0;


    if(now > start) {

        workedSeconds =
            (
                Math.min(
                    now,
                    end
                ) - start
            ) / 1000;


        /*
            扣午休
        */

        if(now > lunchStart) {

            const lunch =
                Math.min(
                    now,
                    lunchEnd
                ) - lunchStart;


            if(lunch > 0) {

                workedSeconds -=
                    lunch / 1000;

            }

        }

    }


    workedSeconds =
        Math.max(
            0,
            Math.min(
                workedSeconds,
                totalWorkSeconds
            )
        );


    /*
        工作进度
    */

    const progress =
        Math.min(
            100,
            workedSeconds /
            totalWorkSeconds *
            100
        );


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    document.getElementById(
        "progressText"
    ).innerText =
        "工作进度 " +
        progress.toFixed(1) +
        "%";


    /*
        正常工资
    */

    const normalEarned =
        salary.hourlySalary *
        workedSeconds /
        3600;


    document.getElementById(
        "normalSalary"
    ).innerText =
        money(
            normalEarned
        );


    document.getElementById(
        "earnedToday"
    ).innerText =
        money(
            normalEarned
        );


    /*
        加班
    */

    const overtimeEnabled =
        document.getElementById(
            "overtimeSwitch"
        ).checked;


    if(!overtimeEnabled) {

        document.getElementById(
            "overtimeSalary"
        ).innerText =
            "¥0.00";


        document.getElementById(
            "overtimeRateInfo"
        ).innerText =
            "";


        /*
            保存正常工资
        */

        saveDailySalaryRecord(
            normalEarned,
            0
        );


        return;
    }


    /*
        加班结束时间
    */

    const overtimeEnd =
        timeToDate(
            settings.overtimeEnd
        );


    let overtimeSeconds = 0;


    if(now > end) {

        overtimeSeconds =
            (
                Math.min(
                    now,
                    overtimeEnd
                ) - end
            ) / 1000;


        overtimeSeconds =
            Math.max(
                0,
                overtimeSeconds
            );
    }


    /*
        加班倒计时
    */

    const overtimeRemaining =
        (
            overtimeEnd -
            now
        ) / 1000;


    document.getElementById(
        "overtimeCountdown"
    ).innerText =
        overtimeRemaining > 0
        ? secondsToTime(
            overtimeRemaining
        )
        : "加班结束 🎉";


    /*
        计算加班时薪
    */

    let overtimeHourly = 0;


    if(
        settings.overtimeMode ===
        "fixed"
    ) {

        /*
            固定加班时薪
        */

        overtimeHourly =
            Number(
                settings.fixedOvertimePay
            ) || 0;


        document.getElementById(
            "overtimeRateInfo"
        ).innerText =
            "固定加班时薪：" +
            money(
                overtimeHourly
            ) +
            " / 小时";

    } else {

        /*
            正常时薪 × 倍率
        */

        overtimeHourly =
            salary.hourlySalary *
            settings.overtimeRate;


        document.getElementById(
            "overtimeRateInfo"
        ).innerText =
            "正常时薪 " +
            money(
                salary.hourlySalary
            ) +
            " × " +
            settings.overtimeRate +
            " 倍";

    }


    /*
        加班工资
    */

    const overtimeEarned =
        overtimeHourly *
        overtimeSeconds /
        3600;


    document.getElementById(
        "overtimeSalary"
    ).innerText =
        money(
            overtimeEarned
        );


    /*
        保存今日工资
    */

    saveDailySalaryRecord(
        normalEarned,
        overtimeEarned
    );

}


/* =====================================================
   初始化
===================================================== */

loadSettings();

update();

updateSalaryRecords();

setInterval(
    update,
    1000
);

</script>
